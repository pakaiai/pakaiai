<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#061525">
<title>Pakai.AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#061525;
  --bg2:#0A2138;
  --card:#0E2B45;
  --card2:#12385A;
  --line:rgba(125,175,220,.16);
  --line2:rgba(125,175,220,.30);
  --lift:rgba(255,255,255,.07);

  --mint:#3DE8A8;
  --sky:#7BA8FF;
  --amber:#FFC46B;
  --coral:#FF8C7C;
  --lilac:#C79BFF;

  --text:#F0F7FC;
  --soft:#9DBBD6;
  --dim:#5E7E9C;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:12px;
  --shadow:0 10px 30px -12px rgba(0,10,25,.75);
  --shell:580px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.6;min-height:100vh;
  padding:18px 16px calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 620px at 12% -8%, rgba(61,232,168,.11), transparent 62%),
    radial-gradient(760px 540px at 96% 4%, rgba(123,168,255,.10), transparent 60%),
    radial-gradient(900px 700px at 50% 108%, rgba(199,155,255,.07), transparent 65%),
    linear-gradient(178deg, var(--bg) 0%, var(--bg2) 52%, var(--bg) 100%);
}
.shell{max-width:var(--shell);margin:0 auto}
.shell.wide{max-width:800px}

/* ---------- kepala ---------- */
.brand{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.mark{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;position:relative;
  background:linear-gradient(140deg,var(--mint),var(--sky));
}
.mark::after{
  content:'';position:absolute;width:7px;height:7px;border-radius:50%;
  background:var(--bg);top:6px;left:6px;
}
.brand b{font-size:14px;font-weight:700;letter-spacing:-.01em}

/* ---------- langkah sesi ---------- */
.steps{display:flex;gap:7px;margin-bottom:26px}
.steps div{
  flex:1;padding:8px 6px 9px;border-radius:var(--r-sm);text-align:center;
  font-size:11px;font-weight:600;color:var(--dim);
  background:rgba(255,255,255,.035);border:1px solid transparent;
  transition:color .3s,background .3s,border-color .3s;
}
.steps div.done{color:var(--soft);background:rgba(61,232,168,.07);border-color:rgba(61,232,168,.18)}
.steps div.now{
  color:var(--bg);background:linear-gradient(135deg,var(--mint),#54F0BB);
  border-color:transparent;box-shadow:0 5px 16px -6px rgba(61,232,168,.6);
}

/* ---------- tipografi ---------- */
h1{font-size:31px;font-weight:800;line-height:1.14;letter-spacing:-.028em;margin-bottom:13px}
h2{font-size:25px;font-weight:800;line-height:1.18;letter-spacing:-.024em;margin-bottom:9px}
p{color:var(--soft);margin-bottom:15px;line-height:1.62}
p.lead{color:var(--text);font-size:17px}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
  color:var(--mint);background:rgba(61,232,168,.10);border:1px solid rgba(61,232,168,.24);
  padding:5px 12px;border-radius:999px;margin-bottom:14px;
}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--mint);font-style:normal}
.note{font-size:13px;line-height:1.55;color:var(--dim)}

/* ---------- kartu dasar ---------- */
.card{
  background:linear-gradient(170deg, var(--card2) 0%, var(--card) 100%);
  border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:14px;right:14px;height:1px;
  background:linear-gradient(90deg,transparent,var(--lift),transparent);
}

/* ---------- tombol ---------- */
button{font-family:inherit;font-size:16px;cursor:pointer;border:none;border-radius:var(--r-md)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.go{
  display:block;width:100%;padding:16px;margin-top:24px;font-weight:700;
  background:linear-gradient(135deg,var(--mint) 0%,#4FF0BA 100%);
  color:#052318;box-shadow:0 12px 26px -12px rgba(61,232,168,.75);
  transition:transform .12s,box-shadow .2s;
}
.go:active{transform:translateY(2px);box-shadow:0 6px 16px -10px rgba(61,232,168,.7)}
.go:disabled{
  background:rgba(255,255,255,.05);color:var(--dim);
  box-shadow:none;cursor:not-allowed;transform:none;
}
.ghost{
  display:block;width:100%;padding:14px;margin-top:11px;font-weight:600;font-size:15px;
  background:rgba(255,255,255,.04);color:var(--soft);border:1px solid var(--line);
  transition:background .2s,color .2s;
}
.ghost:active{background:rgba(255,255,255,.08);color:var(--text)}
.mini{
  background:none;border:none;color:var(--soft);font-size:13px;font-weight:600;
  padding:9px 16px;margin-top:16px;border:1px solid var(--line);border-radius:999px;
}

/* ---------- pembuka ---------- */
.hero{padding:24px 20px 20px;margin-bottom:22px;text-align:center}
.hero .mini-radar{
  width:150px;height:150px;margin:2px auto 20px;position:relative;
  border-radius:20px;background:rgba(6,21,37,.5);border:1px solid var(--line);
}
.mini-radar .cross-v,.mini-radar .cross-h{position:absolute;background:var(--line)}
.mini-radar .cross-v{left:50%;top:10%;bottom:10%;width:1px}
.mini-radar .cross-h{top:50%;left:10%;right:10%;height:1px}
.mini-radar b{
  position:absolute;width:15px;height:15px;border-radius:50%;
  transform:translate(-50%,-50%) scale(0);
  animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
.hero h1{font-size:27px;margin-bottom:11px}
.hero p{margin-bottom:0;font-size:15px}

.flow{margin-bottom:6px}
.flow-item{
  display:flex;gap:14px;align-items:flex-start;padding:15px 17px;
  border-bottom:1px solid var(--line);
}
.flow-item:last-child{border-bottom:none}
.flow-item em{
  flex-shrink:0;width:30px;height:30px;border-radius:10px;font-style:normal;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--bg);
}
.flow-item h3{font-size:15px;font-weight:700;margin-bottom:2px}
.flow-item span{font-size:13px;color:var(--soft);line-height:1.5;display:block}

/* ---------- isian tugas ---------- */
.job{padding:18px;margin-bottom:14px}
.job-tag{
  display:inline-block;font-size:11px;font-weight:700;color:var(--mint);
  background:rgba(61,232,168,.11);padding:4px 10px;border-radius:999px;margin-bottom:11px;
}
textarea{
  width:100%;background:rgba(6,21,37,.55);border:1px solid var(--line);
  border-radius:var(--r-sm);color:var(--text);font-family:inherit;font-size:15px;
  padding:13px;resize:vertical;line-height:1.55;transition:border-color .2s;
}
textarea:focus{border-color:var(--line2)}
textarea::placeholder{color:var(--dim)}
.slide{margin-top:18px}
.slide-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:9px}
.slide-top>span:first-child{color:var(--soft)}
.slide-top b{
  font-size:12px;font-weight:700;color:var(--mint);
  background:rgba(61,232,168,.10);padding:3px 10px;border-radius:999px;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:99px;
  background:rgba(255,255,255,.09);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;cursor:pointer;
  background:linear-gradient(140deg,var(--mint),#54F0BB);
  border:4px solid var(--card);box-shadow:0 3px 12px -3px rgba(61,232,168,.8);
}
input[type=range]::-moz-range-thumb{
  width:26px;height:26px;border-radius:50%;cursor:pointer;border:4px solid var(--card);
  background:linear-gradient(140deg,var(--mint),#54F0BB);box-shadow:0 3px 12px -3px rgba(61,232,168,.8);
}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:7px}

/* ---------- radar besar ---------- */
.radar-wrap{margin:20px 0 8px}
.ylab{font-size:11px;font-weight:600;color:var(--dim);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ylab::before{content:'';width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--dim)}
.radar{
  position:relative;width:100%;aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;
  background:rgba(6,21,37,.45);border:1px solid var(--line);box-shadow:var(--shadow);
}
.q{position:absolute;width:50%;height:50%;padding:14px;transition:background .4s}
.q label{
  font-size:11.5px;font-weight:700;letter-spacing:.005em;color:var(--dim);
  transition:color .4s;display:block;
}
.q.tl{top:0;left:0}
.q.tr{top:0;right:0}
.q.bl{bottom:0;left:0}
.q.br{bottom:0;right:0}
.q.tr label,.q.br label{text-align:right}
.q.bl label,.q.br label{position:absolute;bottom:14px;left:14px;right:14px}
.q.tl.on{background:rgba(61,232,168,.10)} .q.tl.on label{color:var(--mint)}
.q.tr.on{background:rgba(123,168,255,.10)} .q.tr.on label{color:var(--sky)}
.q.bl.on{background:rgba(157,187,214,.07)} .q.bl.on label{color:var(--soft)}
.q.br.on{background:rgba(255,140,124,.10)} .q.br.on label{color:var(--coral)}
.grid-v,.grid-h{position:absolute;background:var(--line);z-index:1}
.grid-v{left:50%;top:0;bottom:0;width:1px}
.grid-h{top:50%;left:0;right:0;height:1px}
.dot{
  position:absolute;width:38px;height:38px;border-radius:50%;z-index:3;
  font-size:14px;font-weight:800;color:#052318;
  display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);
  transition:left .6s cubic-bezier(.34,1.3,.64,1),top .6s cubic-bezier(.34,1.3,.64,1);
}
.dot::after{
  content:'';position:absolute;inset:-5px;border-radius:50%;
  border:1.5px solid currentColor;opacity:.32;
}

/* ---------- daftar hasil ---------- */
.rows{margin:18px 0 6px}
.row{display:flex;gap:13px;align-items:flex-start;padding:14px 17px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row em{
  flex-shrink:0;width:27px;height:27px;border-radius:9px;font-style:normal;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#052318;
}
.row p{margin:0;color:var(--text);font-size:15px;line-height:1.45}
.row small{font-size:12px;font-weight:600;display:block;margin-top:3px}

.pick{padding:19px;margin:20px 0;border-color:var(--line2)}
.pick .eyebrow{margin-bottom:10px}
.pick strong{font-size:18px;font-weight:700;line-height:1.38;display:block}

/* ---------- jam ---------- */
.clock-box{text-align:center;padding:22px 0 18px}
.clock{
  font-size:62px;font-weight:800;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(140deg,var(--mint),var(--sky));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.clock.low{background:linear-gradient(140deg,var(--amber),var(--coral));-webkit-background-clip:text;background-clip:text}
.clock-sub{font-size:12px;color:var(--dim);font-weight:600;margin-top:5px}
.bar{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar i{
  display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--sky),var(--mint));transition:width 1s linear;
}
.bar i.low{background:linear-gradient(90deg,var(--coral),var(--amber))}

/* ---------- skor ---------- */
.score{position:relative;text-align:center;padding:40px 0 20px}
.score::before{
  content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:230px;height:230px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(61,232,168,.20), transparent 68%);
}
.score b{
  position:relative;font-size:96px;font-weight:800;letter-spacing:-.055em;line-height:1;display:block;
  background:linear-gradient(150deg,var(--mint) 10%,var(--sky) 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums;
}
.score small{position:relative;font-size:13px;font-weight:600;color:var(--dim);display:block;margin-top:8px}
.disclaim{
  display:flex;gap:12px;padding:15px 17px;border-radius:var(--r-md);margin:20px 0;
  background:rgba(123,168,255,.08);border:1px solid rgba(123,168,255,.22);
  font-size:14px;line-height:1.55;color:var(--text);
}
.disclaim i{
  flex-shrink:0;width:20px;height:20px;border-radius:50%;font-style:normal;
  background:var(--sky);color:var(--bg);font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.quote{padding:17px}
.quote .job-tag{margin-bottom:9px}
.quote p{color:var(--text);margin:0;font-size:15px;line-height:1.6;white-space:pre-wrap}

.bd{margin-top:16px;padding:6px 17px}
.bd-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.bd-row:last-child{border-bottom:none}
.bd-chip{
  flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:.02em;
  padding:4px 9px;border-radius:7px;color:#071A2E;
}
.bd-row .bd-text{flex:1;font-size:13.5px;color:var(--soft);line-height:1.4}
.bd-meter{flex-shrink:0;width:52px;height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bd-meter i{display:block;height:100%;border-radius:99px}
.bd-val{flex-shrink:0;width:24px;text-align:right;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- repair shop ---------- */
.case{
  display:block;width:100%;text-align:left;padding:17px;margin-bottom:12px;color:var(--text);
  background:linear-gradient(170deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:var(--r-lg);
  transition:border-color .2s,transform .12s;
}
.case:active{transform:scale(.985)}
.case b{font-size:16.5px;font-weight:700;display:block;margin-bottom:3px}
.case span{font-size:13px;color:var(--soft);line-height:1.45;display:block}

.bad{
  padding:16px 18px;margin:18px 0;border-radius:var(--r-md);
  background:rgba(255,140,124,.07);border:1px dashed rgba(255,140,124,.35);
}
.bad span{font-size:11px;font-weight:700;color:var(--coral);display:block;margin-bottom:6px}
.bad q{font-size:17px;color:var(--text);font-style:italic;quotes:'"' '"'}

.bench-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--soft);margin:0 2px 9px}
.bench-label u{text-decoration:none;color:var(--dim);font-weight:600}
.bench{
  padding:8px;margin-bottom:20px;border-radius:var(--r-lg);min-height:96px;
  background:rgba(6,21,37,.35);border:1px solid var(--line);
}
.slot{
  border:1px dashed var(--line);border-radius:var(--r-md);padding:26px 14px;margin:5px;
  font-size:13px;color:var(--dim);text-align:center;
}
.brick{
  position:relative;border-radius:var(--r-md);padding:13px 40px 13px 15px;margin:6px;
  background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--line2);cursor:pointer;
  transition:transform .13s,border-color .2s,background .2s;
}
.brick:active{transform:scale(.982)}
.brick span{font-size:10px;font-weight:800;letter-spacing:.03em;display:block;margin-bottom:4px}
.brick p{font-size:14px;color:var(--text);margin:0;line-height:1.48}
.brick i{
  position:absolute;top:50%;right:12px;transform:translateY(-50%);
  width:23px;height:23px;border-radius:50%;font-style:normal;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;background:rgba(255,255,255,.07);color:var(--soft);
}
.bench.on .brick{animation:snap .28s cubic-bezier(.34,1.4,.64,1)}
@keyframes snap{0%{transform:scale(.93)}100%{transform:scale(1)}}
.empty-shelf{font-size:13px;color:var(--dim);padding:26px 14px;text-align:center}

/* ---------- output ---------- */
.verdict{display:flex;gap:13px;padding:16px 18px;border-radius:var(--r-md);margin-bottom:16px;font-size:14px;line-height:1.55}
.verdict i{
  flex-shrink:0;width:24px;height:24px;border-radius:50%;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--bg);
}
.verdict b{display:block;margin-bottom:3px;font-weight:700;font-size:15px;color:var(--text)}
.verdict p{margin:0;color:var(--soft);font-size:13.5px}
.verdict.ok{background:rgba(61,232,168,.09);border:1px solid rgba(61,232,168,.28)}
.verdict.ok i{background:var(--mint)}
.verdict.bad{background:rgba(255,196,107,.08);border:1px solid rgba(255,196,107,.30)}
.verdict.bad i{background:var(--amber)}

.out{padding:0;margin:16px 0;overflow:hidden}
.out-head{
  display:flex;align-items:center;gap:8px;padding:13px 18px;
  font-size:12px;font-weight:600;color:var(--soft);
  background:rgba(6,21,37,.4);border-bottom:1px solid var(--line);
}
.out-head em{width:7px;height:7px;border-radius:50%;background:var(--mint);font-style:normal;flex-shrink:0}
.out-body{padding:18px;font-size:15px;line-height:1.75;white-space:pre-wrap;color:var(--text)}
.out-body mark{
  background:rgba(255,196,107,.16);color:var(--amber);
  padding:2px 5px;border-radius:5px;font-weight:600;
}
.miss{list-style:none;margin-top:16px}
.miss li{
  display:flex;gap:12px;padding:14px 16px;margin-bottom:9px;border-radius:var(--r-md);
  background:rgba(255,255,255,.035);border:1px solid var(--line);
  font-size:14px;line-height:1.5;color:var(--soft);
}
.miss li b{flex-shrink:0;font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;color:#071A2E;height:fit-content}

/* ---------- penutup ---------- */
.wrap-card{padding:17px;margin-bottom:12px}
.wrap-card span{font-size:11px;font-weight:700;display:block;margin-bottom:6px}
.wrap-card p{color:var(--text);margin:0;font-size:15.5px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.chips b{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:7px;color:#071A2E}
.foot{text-align:center;font-size:12px;color:var(--dim);margin-top:40px}

@media(min-width:620px){
  body{padding:30px 24px 80px}
  h1{font-size:40px}
  h2{font-size:30px}
  .hero h1{font-size:33px}
  .hero .mini-radar{width:180px;height:180px}
  .clock{font-size:78px}
  .score b{font-size:118px}
  .brick p{font-size:15px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .mini-radar b{transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>
<body>
<div class="shell" id="app"></div>

<script>
/* =========================================================
   Pakai.AI - alat fasilitasi kelas AI
   Tiga sesi: Radar Tugas, Prompt Battle, Prompt Repair Shop
   Tanpa server. Semua data tersimpan di perangkat peserta.
   ========================================================= */

var app = document.getElementById('app');

var S = {
  screen:'welcome',
  jobs:[{text:'',freq:5,judge:5},{text:'',freq:5,judge:5},{text:'',freq:5,judge:5}],
  chosen:'', prompt:'', score:null, detail:null, showDetail:false,
  seconds:200, timerId:null, caseId:null, placed:[], justPlaced:false
};

var C = {mint:'#3DE8A8', sky:'#7BA8FF', amber:'#FFC46B', coral:'#FF8C7C', lilac:'#C79BFF', soft:'#9DBBD6'};

/* warna per komponen prompt, dipakai konsisten di sesi 2 dan 3 */
var BLOCK_COLOR = {
  ROLE:C.amber, CONTEXT:C.sky, COMMAND:C.mint, CONSTRAINT:C.coral, OUTPUT:C.lilac
};

/* ---------- penyimpanan lokal ---------- */
function save(){
  try{
    localStorage.setItem('pakaiai', JSON.stringify({
      jobs:S.jobs, chosen:S.chosen, prompt:S.prompt,
      score:S.score, detail:S.detail, caseId:S.caseId, placed:S.placed
    }));
  }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem('pakaiai');
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d.jobs) S.jobs = d.jobs;
    if(d.chosen) S.chosen = d.chosen;
    if(typeof d.prompt === 'string') S.prompt = d.prompt;
    if(typeof d.score === 'number') S.score = d.score;
    if(d.detail) S.detail = d.detail;
    if(d.caseId) S.caseId = d.caseId;
    if(d.placed) S.placed = d.placed;
  }catch(e){}
}

/* ---------- utilitas ---------- */
function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function steps(n){
  var names = ['Radar tugas','Prompt Battle','Repair Shop'];
  var h = '<div class="brand"><div class="mark"></div><b>Pakai.AI</b></div><div class="steps">';
  for(var i=1;i<=3;i++){
    var cls = i === n ? 'now' : (i < n ? 'done' : '');
    h += '<div class="' + cls + '">' + names[i-1] + '</div>';
  }
  return h + '</div>';
}
function go(screen){
  S.screen = screen; save(); render(); window.scrollTo(0,0);
}

   MESIN PENILAIAN PROMPT
   Berbasis pola, berjalan penuh di perangkat.
   Lima aspek, masing masing 0 / 12 / 20.
   ========================================================= */

var PROFESI = ['analis','analyst','manajer','manager','konsultan','editor','penulis',
  'spesialis','ahli','pakar','staf','direktur','hrd','sdm','marketing','sales','penjualan',
  'akuntan','auditor','sekretaris','guru','dosen','trainer','peneliti','perencana',
  'desainer','programmer','jurnalis','copywriter','supervisor','asisten','koordinator'];

function scorePrompt(raw){
  var t = ' ' + raw.toLowerCase().replace(/\s+/g,' ') + ' ';
  var words = t.trim().split(' ').filter(Boolean);
  var hasNum = /\d/.test(t);
  var d = {};
  function any(l){ for(var i=0;i<l.length;i++) if(t.indexOf(l[i]) !== -1) return true; return false; }
  function cnt(l){ var n=0; for(var i=0;i<l.length;i++) if(t.indexOf(l[i]) !== -1) n++; return n; }

  var roleCue = ['kamu adalah','anda adalah','kamu berperan','anda berperan','berperan sebagai',
    'bertindak sebagai','sebagai seorang','anggap kamu','anggap anda','posisikan diri',
    'act as','you are','kamu seorang','anda seorang'];
  if(any(roleCue)) d.role = any(PROFESI) ? 20 : 12;
  else d.role = (any(PROFESI) && words.length > 8) ? 12 : 0;

  var ctxCue = ['data','berisi','terdiri dari','saat ini','kondisi','latar belakang','perusahaan',
    'tim','divisi','konteks','situasi','periode','kuartal','semester','bulan','tahun',
    'klien','pelanggan','karyawan','peserta','proyek','laporan','dokumen'];
  var c = cnt(ctxCue);
  d.context = (c >= 2 || (c === 1 && hasNum)) ? 20 : (c === 1 ? 12 : 0);

  var cmdCue = ['analisis','analisa','buatkan','buat ','ringkas','rangkum','bandingkan',
    'identifikasi','susun','tuliskan','tulis ','hitung','evaluasi','jelaskan','uraikan',
    'kelompokkan','urutkan','periksa','rekomendasikan','carikan','temukan','rancang',
    'terjemahkan','perbaiki','review','sarankan'];
  d.command = any(cmdCue) ? (words.length >= 12 ? 20 : 12) : 0;

  var conCue = ['jangan','hanya','tanpa','maksimal','minimal','hindari','pastikan',
    'tidak boleh','batasi','kecuali','harus','dilarang','cukup ','wajib'];
  var k = cnt(conCue);
  d.constraint = (k >= 2 || (k === 1 && hasNum)) ? 20 : (k === 1 ? 12 : 0);

  var outCue = ['tabel','poin','bullet','paragraf','ringkasan','daftar','format','kolom',
    'bagian','slide','butir','bagan','diagram','template','struktur','kata','kalimat',
    'halaman','baris'];
  d.output = any(outCue) ? (hasNum ? 20 : 12) : 0;

  d.total = d.role + d.context + d.command + d.constraint + d.output;
  return d;
}

function vRadar(){
  var h = steps(1) +
  '<span class="eyebrow"><i></i>Sesi 1</span>' +
  '<h2>Tulis tiga pekerjaan yang kamu kerjakan berulang</h2>' +
  '<p>Yang biasa saja, yang tiap minggu kamu lakukan. Tidak perlu yang keren.</p>';

  for(var i=0;i<3;i++){
    var j = S.jobs[i];
    h += '<div class="card job">' +
      '<span class="job-tag">Tugas ' + (i+1) + '</span>' +
      '<textarea rows="2" data-i="' + i + '" data-f="text" placeholder="Contoh: bikin rekap laporan mingguan">' + esc(j.text) + '</textarea>' +
      '<div class="slide">' +
        '<div class="slide-top"><span>Seberapa sering</span><b id="fl' + i + '">' + freqWord(j.freq) + '</b></div>' +
        '<input type="range" min="1" max="10" value="' + j.freq + '" data-i="' + i + '" data-f="freq">' +
        '<div class="ends"><span>Sesekali</span><span>Hampir tiap hari</span></div>' +
      '</div>' +
      '<div class="slide">' +
        '<div class="slide-top"><span>Seberapa butuh pertimbangan kamu</span><b id="jl' + i + '">' + judgeWord(j.judge) + '</b></div>' +
        '<input type="range" min="1" max="10" value="' + j.judge + '" data-i="' + i + '" data-f="judge">' +
        '<div class="ends"><span>Tinggal kerjakan</span><span>Harus dipikirkan</span></div>' +
      '</div>' +
    '</div>';
  }

  var ready = countReady() === 3;
  h += '<button class="go" id="next" ' + (ready?'':'disabled') + ' onclick="go(\'radarResult\')">Lihat radar saya</button>' +
       '<p class="note" id="hint" style="text-align:center;margin-top:11px;' + (ready?'display:none':'') + '">Isi ketiga tugas dulu</p>';
  return h;
}
function countReady(){ return S.jobs.filter(function(j){return j.text.trim().length > 2;}).length; }
function freqWord(v){ return v<=3?'Sesekali':v<=6?'Cukup sering':v<=8?'Sering':'Hampir tiap hari'; }
function judgeWord(v){ return v<=3?'Tinggal kerjakan':v<=6?'Sedikit dipikirkan':v<=8?'Perlu dipikirkan':'Harus dipikirkan matang'; }

var radarBound = false;
function bindRadar(){
  if(radarBound) return;
  radarBound = true;
  app.addEventListener('input', function(e){
    if(S.screen !== 'radar') return;
    var el = e.target, i = el.getAttribute('data-i');
    if(i === null) return;
    i = +i;
    var f = el.getAttribute('data-f');
    if(f === 'text'){
      S.jobs[i].text = el.value;
      var ready = countReady() === 3;
      var btn = document.getElementById('next'), hint = document.getElementById('hint');
      if(btn) btn.disabled = !ready;
      if(hint) hint.style.display = ready ? 'none' : '';
    }else{
      S.jobs[i][f] = +el.value;
      var lbl = document.getElementById((f === 'freq' ? 'fl' : 'jl') + i);
      if(lbl) lbl.textContent = (f === 'freq' ? freqWord : judgeWord)(+el.value);
    }
    save();
  });
}

/* --- sesi 1: hasil --- */
function zoneOf(j){
  var sering = j.freq >= 6, mikir = j.judge >= 6;
  if(sering && !mikir) return 'ai';
  if(sering && mikir) return 'bareng';
  if(!sering && !mikir) return 'nanti';
  return 'sendiri';
}
var ZONE = {
  ai:{name:'Kasih ke AI', color:C.mint},
  bareng:{name:'Bareng AI', color:C.sky},
  nanti:{name:'Nanti Saja', color:C.soft},
  sendiri:{name:'Kerjakan Sendiri', color:C.coral}
};

    '<strong>' + esc(S.chosen) + '</strong></div>' +
  '<button class="go" onclick="go(\'battleIntro\')">Lanjut ke sesi 2</button>' +
  '<button class="ghost" onclick="go(\'radar\')">Ubah jawaban saya</button>';
  return h;
}
function choosePick(){
  var best = 0, bs = -999;
  S.jobs.forEach(function(j,i){ var s = j.freq - j.judge; if(s > bs){ bs = s; best = i; } });
  return best;
}

/* --- sesi 2 --- */
function vBattleIntro(){
  return steps(2) +
  '<span class="eyebrow"><i></i>Sesi 2</span>' +
  '<h2>Sekarang suruh AI mengerjakannya</h2>' +
  '<div class="card pick"><span class="eyebrow"><i></i>Tugasnya</span><strong>' + esc(S.chosen) + '</strong></div>' +
  '<p class="lead">Tulis perintah yang akan kamu berikan ke AI untuk tugas itu. Apa adanya saja, seperti biasanya kamu mengetik.</p>' +
  '<p>Waktunya 200 detik dan berjalan begitu kamu menekan tombol. Boleh dikirim lebih cepat kalau sudah selesai.</p>' +
  '<button class="go" onclick="startWrite()">Mulai menulis</button>';
}
function startWrite(){ S.seconds = 200; go('battleWrite'); }

function vBattleWrite(){
  return steps(2) +
  '<div class="clock-box">' +
    '<div class="clock" id="clock">' + fmt(S.seconds) + '</div>' +
    '<div class="clock-sub">sisa waktu</div>' +
  '</div>' +
  '<div class="bar"><i id="bar"></i></div>' +
  '<div class="card pick" style="margin-top:0"><span class="eyebrow"><i></i>Tugasnya</span><strong>' + esc(S.chosen) + '</strong></div>' +
  '<textarea id="pen" rows="9" placeholder="Ketik perintah kamu untuk AI di sini">' + esc(S.prompt) + '</textarea>' +
  '<button class="go" onclick="submitPrompt()">Kirim perintah saya</button>';
}
function fmt(s){ var m = Math.floor(s/60), r = s%60; return m + ':' + (r<10?'0':'') + r; }

function bindWrite(){
  var pen = document.getElementById('pen');
  pen.addEventListener('input', function(){ S.prompt = pen.value; });
  pen.focus();
  if(S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function(){
    S.seconds--;
    var c = document.getElementById('clock'), b = document.getElementById('bar');
    if(!c){ clearInterval(S.timerId); return; }
    c.textContent = fmt(S.seconds);
    b.style.width = (S.seconds/200*100) + '%';
    if(S.seconds <= 30){ c.className = 'clock low'; b.className = 'low'; }
    if(S.seconds <= 0){ clearInterval(S.timerId); submitPrompt(); }
  },1000);
}

function submitPrompt(){
  if(S.timerId) clearInterval(S.timerId);
  var pen = document.getElementById('pen');
  if(pen) S.prompt = pen.value;
  S.detail = scorePrompt(S.prompt || '');
  S.score = S.detail.total;
  S.showDetail = false;
  go('battleScore');
}

function countUp(){
  var el = document.getElementById('num');
  if(!el) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.textContent = S.score; return;
  }
  var n = 0, target = S.score, step = Math.max(1, Math.round(target/26));
  var id = setInterval(function(){
    n += step;
    if(n >= target){ n = target; clearInterval(id); }
    el.textContent = n;
  }, 26);
}

function vBattleScore(){
  var h = steps(2) +
  '<div class="score"><b id="num">0</b><small>dari 100</small></div>' +
  '<div class="disclaim"><i>i</i><div>Angka ini mengukur kelengkapan struktur perintah kamu, bukan kualitas ide kamu. Perintah yang bagus isinya bisa saja dapat angka kecil kalau strukturnya belum lengkap.</div></div>' +
  '<div class="card quote">' +
    '<span class="job-tag">Perintah yang kamu tulis</span>' +
    '<p>' + (S.prompt.trim() ? esc(S.prompt) : '<em style="color:var(--dim)">Kosong</em>') + '</p>' +
  '</div>';

  if(S.showDetail){
    h += '<div class="card bd">';
    BLOCK_ORDER.forEach(function(k){
      var key = k.toLowerCase(), v = S.detail[key], col = BLOCK_COLOR[k];
      h += '<div class="bd-row">' +
        '<span class="bd-chip" style="background:' + col + '">' + k + '</span>' +
        '<span class="bd-text">' + BLOCK_LABEL[k] + '</span>' +
        '<span class="bd-meter"><i style="width:' + (v/20*100) + '%;background:' + col + '"></i></span>' +
        '<span class="bd-val" style="color:' + (v ? col : 'var(--dim)') + '">' + v + '</span>' +
      '</div>';
    });
    h += '</div>';
  }else{
    h += '<p class="note" style="text-align:center;margin-top:26px">Trainer akan membahas angka ini dulu bersama kelas.</p>' +
         '<div style="text-align:center"><button class="mini" onclick="S.showDetail=true;render()">Buka rincian nilainya</button></div>';
  }

  h += '<button class="go" onclick="go(\'repairPick\')">Lanjut ke sesi 3</button>';
  if(S.showDetail) h += '<button class="ghost" onclick="startWrite()">Tulis ulang perintah saya</button>';
  return h;
}

/* --- sesi 3 --- */
function vRepairPick(){
  var h = steps(3) +
  '<span class="eyebrow"><i></i>Sesi 3</span>' +
  '<h2>Prompt Repair Shop</h2>' +
  '<p>Ada perintah buruk yang harus kamu perbaiki. Pilih kasus yang paling dekat dengan pekerjaan kamu.</p>';
  CASES.forEach(function(c){
    h += '<button class="case" onclick="pickCase(\'' + c.id + '\')">' +
      '<b>' + c.name + '</b><span>' + c.hint + '</span></button>';
  });
  return h;
}
function pickCase(id){ S.caseId = id; S.placed = []; go('repairBuild'); }
function currentCase(){
  for(var i=0;i<CASES.length;i++) if(CASES[i].id === S.caseId) return CASES[i];
  return CASES[0];
}

function brickHtml(c,k,inBench){
  var col = BLOCK_COLOR[k];
  return '<div class="brick" onclick="toggleBrick(\'' + k + '\')" style="border-left-color:' +
    (inBench ? col : 'rgba(125,175,220,.30)') + '">' +
    '<i>' + (inBench ? '&times;' : '+') + '</i>' +
    '<span style="color:' + col + '">' + k + '</span>' +
    '<p>' + esc(c.bricks[k]) + '</p></div>';
}

function vRepairBuild(){
  var c = currentCase();
  var shelf = BLOCK_ORDER.filter(function(k){ return S.placed.indexOf(k) === -1; });

  var h = steps(3) +
  '<span class="eyebrow"><i></i>Sesi 3</span>' +
  '<h2>' + c.name + '</h2>' +
  '<div class="bad"><span>Perintah yang dipakai orang biasanya</span><q>' + esc(c.bad) + '</q></div>' +
  '<p>Pasang balok untuk memperbaikinya. Boleh semua, boleh sebagian saja, lalu lihat apa yang terjadi.</p>' +
  '<div class="bench-label"><span>Perintah kamu</span><u>' + S.placed.length + ' dari 5 balok</u></div>' +
  '<div class="bench' + (S.justPlaced ? ' on' : '') + '">';

  if(S.placed.length === 0){
    h += '<div class="slot">Ketuk balok di bawah untuk memasangnya</div>';
  }else{
    BLOCK_ORDER.forEach(function(k){
      if(S.placed.indexOf(k) !== -1) h += brickHtml(c,k,true);
    });
  }
  h += '</div>';

  h += '<div class="bench-label"><span>Balok yang tersedia</span></div><div class="bench">';
  if(shelf.length === 0) h += '<div class="empty-shelf">Semua balok sudah terpasang</div>';
  else shelf.forEach(function(k){ h += brickHtml(c,k,false); });
  h += '</div>';

  h += '<button class="go" onclick="go(\'repairOut\')">Jalankan perintah</button>' +
       '<button class="ghost" onclick="go(\'repairPick\')">Ganti kasus</button>';
  return h;
}

function toggleBrick(k){
  var i = S.placed.indexOf(k);
  if(i === -1){ S.placed.push(k); S.justPlaced = true; }
  else S.placed.splice(i,1);
  save(); render();
}

function vRepairOut(){
  var c = currentCase();
  var missing = BLOCK_ORDER.filter(function(k){ return S.placed.indexOf(k) === -1; });
  var complete = missing.length === 0;
  var body, verdict;

  if(complete){
    body = c.good;
    verdict = '<div class="verdict ok"><i>&check;</i><div><b>Hasilnya bisa langsung dipakai</b>' +
      '<p>Lima balok terpasang. AI tahu perannya, tahu datanya, tahu yang diminta, tahu batasnya, dan tahu bentuk hasilnya.</p></div></div>';
  }else{
    var lead = ['CONSTRAINT','CONTEXT','COMMAND','OUTPUT','ROLE'].filter(function(k){
      return missing.indexOf(k) !== -1;
    })[0];
    body = c.broken[lead];
    var kata = missing.length === 1 ? 'Satu balok' : missing.length + ' balok';
    verdict = '<div class="verdict bad"><i>!</i><div><b>' + kata + ' belum terpasang</b>' +
      '<p>Perhatikan bagian yang ditandai. Itu akibat dari balok yang tidak ada.</p></div></div>';
  }

  var h = steps(3) + verdict +
  '<div class="card out">' +
    '<div class="out-head"><em></em>Simulasi jawaban AI</div>' +
    '<div class="out-body">' + body + '</div>' +
  '</div>';

  if(!complete){
    h += '<ul class="miss">';
    missing.forEach(function(k){
      h += '<li><b style="background:' + BLOCK_COLOR[k] + '">' + k + '</b>' +
           '<span>' + BLOCK_EFFECT[k] + '</span></li>';
    });
    h += '</ul>';
    h += '<button class="go" onclick="go(\'repairBuild\')">Pasang balok yang kurang</button>' +
         '<button class="ghost" onclick="go(\'closing\')">Lanjut ke penutup</button>';
  }else{
    h += '<button class="go" onclick="go(\'closing\')">Lanjut ke penutup</button>' +
         '<button class="ghost" onclick="go(\'repairBuild\')">Coba lepas satu balok</button>';
  }
  return h;
}

/* --- penutup --- */
function vClosing(){
  var idx = choosePick();
  var z = ZONE[zoneOf(S.jobs[idx])];
  var chips = BLOCK_ORDER.map(function(k){
    return '<b style="background:' + BLOCK_COLOR[k] + '">' + k + '</b>';
  }).join('');

  return steps(3) +
  '<span class="eyebrow"><i></i>Selesai</span>' +
  '<h2>Satu hal untuk dicoba minggu ini</h2>' +
  '<p>Ini bawaan kamu dari tiga sesi tadi. Salin sebelum menutup halaman.</p>' +
  '<div class="card wrap-card"><span style="color:' + z.color + '">Tugas yang paling layak dibantu AI</span>' +
    '<p>' + esc(S.jobs[idx].text) + '</p></div>' +
  '<div class="card wrap-card"><span style="color:' + C.sky + '">Perintah yang kamu tulis sendiri</span>' +
    '<p>' + (S.prompt.trim() ? esc(S.prompt) : 'Belum ada') + '</p></div>' +
  '<div class="card wrap-card"><span style="color:' + C.lilac + '">Lima balok yang membuat perintah jadi utuh</span>' +
    '<div class="chips">' + chips + '</div></div>' +
  '<button class="go" onclick="copyAll()" id="cp">Salin semuanya</button>' +
  '<button class="ghost" onclick="resetAll()">Mulai dari awal</button>' +
  '<p class="foot">Pakai.AI</p>';
}

function copyAll(){
  var idx = choosePick();
  var txt = 'Tugas yang paling layak dibantu AI:\n' + S.jobs[idx].text +
    '\n\nPerintah saya:\n' + (S.prompt || '-') +
    '\n\nLima balok prompt:\nROLE, CONTEXT, COMMAND, CONSTRAINT, OUTPUT';
  var btn = document.getElementById('cp');
  function done(){ btn.textContent = 'Tersalin'; setTimeout(function(){ btn.textContent = 'Salin semuanya'; },1800); }
  function fb(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ btn.textContent = 'Gagal menyalin, salin manual dari kartu di atas'; }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done).catch(fb);
  else fb();
}

function resetAll(){
  try{ localStorage.removeItem('pakaiai'); }catch(e){}
  S.jobs = [{text:'',freq:5,judge:5},{text:'',freq:5,judge:5},{text:'',freq:5,judge:5}];
  S.chosen=''; S.prompt=''; S.score=null; S.detail=null;
  S.showDetail=false; S.caseId=null; S.placed=[];
  go('welcome');
}

load();
render();
</script>
</body>
</html>
